<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>航海小程序</title>
   
<link rel="preload" as="image" href="background.jpg">

 <style>
    
@media (max-width: 768px) {
    .footer {
        font-size: 12px;
        padding: 0 10px;
    }
}
 
     body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;  /* 改为从顶部开始 */
    min-height: 100vh;
    background-color: #0a1628;    /* 临时深色背景 */
    background: url('background.jpg') no-repeat center center fixed;
    background-size: cover;
    position: relative;
    padding-top: 330px;           /* 向上留出空间 */
}

        /* 添加半透明遮罩层，确保文字可读性 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: -1;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 40px;
            font-size: 3.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.3);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 300px;
        }

        .btn {
            display: block;
            text-align: center;
            padding: 15px 30px;
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        /* 海图按钮 - 深海蓝 */
        .btn-primary {
            background-color: #0288d1;
        }
        .btn-primary:hover {
            background-color: #0277bd;
        }

        /* 索星卡按钮 - 航海绿 */
        .btn-success {
            background-color: #00897b;
        }
        .btn-success:hover {
            background-color: #00796b;
        }

        /* 雷达按钮 - 橙红色 */
        .btn-radar {
            background-color: #d84315;
        }
        .btn-radar:hover {
            background-color: #bf360c;
        }

        /* 航线设计按钮 - 航海紫 */
        .btn-route {
            background-color: #8e44ad;
        }
        .btn-route:hover {
            background-color: #732d91;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

      
       .footer {
            margin-top: 50px;
            color: #888888;
            font-size: 14px;
       text-align: center;           /*文字水平居中 */
       padding: 0 20px;                /* 左右留边距，防止贴边 */
       max-width: 800px;             /* 限制最大宽度 */
       margin-left: auto;            /* 自动左边距 */
       margin-right: auto;           /* 自动右边距 */

       }
 .info {
            color:   #888888;	
            margin-top: 15px;
            font-size: 14px;

    
       
        }
    </style>
</head>
<body>



   <h1>⚓️ 航海小程序</h1>

    <div class="button-container">
        <a href="chart.html" class="btn btn-primary">
            🌊 恒向线与大圆航线
        </a>
      <a href="route.html" class="btn btn-route">
            🗺️ 航线设计
        </a>
        
        <a href="star_simulator.html" class="btn btn-success">
            ⭐ 索星卡模拟器
        </a>

        <a href="radar.html" class="btn btn-radar">
            📡 雷达模拟器
        </a>

<div class="info" style="text-align: center; padding: 0 20px; max-width: 600px; margin-left: auto; margin-right: auto;">

</div>

</body>
</html>
