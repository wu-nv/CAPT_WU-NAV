<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPT_WU 航海小程序</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #f0f4f8; /* 浅蓝灰色背景 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            color: white;
            background-color: #007bff; /* 按钮蓝色 */
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #0056b3; /* 鼠标悬停变深蓝 */
        }
        .btn-secondary {
            background-color: #28a745; /* 第二个按钮用绿色 */
        }
        .btn-secondary:hover {
            background-color: #1e7e34;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚓ 航海小程序</h1>
        <p>请选择你要使用的工具：</p>
        
        <!-- 按钮 1：链接到原来的海图/图表 -->
        <!-- 注意：如果你之前把 chart.html 改回了原名，这里要改成 chart.html -->
        <a href="chart.html" class="btn">🌊 恒向线与大圆航线</a>
        <br> <!-- 这是一个换行符，让两个按钮分开一点 -->

<a href="star_simulator.html" class="btn btn-success">
    ⭐ 索星卡模拟器
</a>
        <br>

    </div>

</body>
</html>
