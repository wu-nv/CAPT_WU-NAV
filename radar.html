<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>航海小程序</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f7fa 0%, #80deea 100%);
        }

        h1 {
            color: #006064;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 300px;
        }

        .btn {
            display: block;
            text-align: center;
            padding: 15px 30px;
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        /* 海图按钮 - 深海蓝 */
        .btn-primary {
            background-color: #0288d1;
        }
        .btn-primary:hover {
            background-color: #0277bd;
        }

        /* 索星卡按钮 - 航海绿 */
        .btn-success {
            background-color: #00897b;
        }
        .btn-success:hover {
            background-color: #00796b;
        }

        /* 雷达按钮 - 橙红色 */
        .btn-radar {
            background-color: #d84315;
        }
        .btn-radar:hover {
            background-color: #bf360c;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .footer {
            margin-top: 50px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>

   <h1>⚓️ 航海小程序</h1>

    <div class="button-container">
        <a href="chart.html" class="btn btn-primary">
            🌊 恒向线与大圆航线
        </a>

        <a href="star_simulator.html" class="btn btn-success">
            ⭐ 索星卡模拟器
        </a>

        <a href="radar5.html" class="btn btn-radar">
            📡 雷达模拟器
        </a>
    </div>

    <div class="footer">
        &copy; 2026 CAPT_WU. All Rights Reserved.
    </div>

</body>
</html>
